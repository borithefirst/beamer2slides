[project]
name = "beamer2slides"
version = "0.10.0"
description = "Convert beamer PDFs into editable Google Slides decks"
readme = "README.md"
# An SPDX string, not `{text = "MIT"}`: setuptools deprecated the table in 77 and stops building
# it in February 2027, which is why the build requirement below is at least 77.
license = "MIT"
# 3.10: Google's monorepo builds some targets with it (tests/test_python310.py, workflow python310)
requires-python = ">=3.10"
dependencies = [
    "pypdfium2>=5.0",
    "numpy>=2.0",
    "pillow>=10.1",
    "python-pptx>=1.0",
    # Font files, which `adopt` cannot do without: which faces this machine has and what they cover
    # (scripts.py), how wide a stand-in sets the deck's words (adopt.font_widths, deck_thumbs), and
    # the static instances cut out of a variable font fetched from google/fonts (fontfetch.py). It
    # was the `[pure]` extra alone, for the pure PDF backend - and an install without it read a
    # foreign deck, fetched its fonts and then died on `import fontTools` with the source tree
    # unwritten (the playground's own image, 2026-09-21).
    "fonttools>=4.40",
]

[project.optional-dependencies]
# Talking to Google. An extra rather than a dependency since 0.4.0, because a caller may have its
# own client - `google_auth.use_services` takes ready Slides/Drive/Docs clients, or a builder that
# answers from a bundled discovery document - and a journey that talks to nobody (`deck_prepare`,
# `deck_inspect`, `tex_label`, `tex_converge`) needs neither the package nor an account. Every use
# of it is behind a function in `gapi.py`, which is the only module that imports it; without it the
# local journeys run and anything reaching Google says so in one sentence (`gapi.MISSING`).
# Anyone converting a deck from this machine's own token wants `beamer2slides[google]`.
google = ["google-api-python-client>=2.0", "google-auth-oauthlib>=1.2"]
# The pure Python PDF backend (B2S_PDF_BACKEND=pure, docs/pdf-from-scratch.md) reads embedded font
# programs and the Adobe Glyph List through fontTools. A plain dependency since the day adopt
# needed it too; the name stays, so what the docs and older installs ask for still resolves.
pure = ["fonttools>=4.40"]
# The MCP server (`beamer2slides.agent.mcp`) speaks the protocol through the reference SDK.
# Everything else in beamer2slides.agent - the tools, the schemas, `mcp.dispatch` - works without it.
# Either generation: 1.x takes its handlers through decorators, 2.x through the constructor, and
# `serve` wires itself to whichever is there (the wire protocol is the same either way).
mcp = ["mcp>=1.2"]
# Font files handed to adopt as .woff2 (`adopt --fonts`, `deck_adopt(fonts=...)`, fontfiles.py):
# fontTools unwraps them only with Brotli. .ttf, .otf, .ttc and .woff need nothing more, and a
# .woff2 without it is reported as not used, with this line's fix, rather than failing the run.
woff2 = ["brotli>=1.0"]
# What the tests need beyond the package itself. pytest-xdist is what makes `-n auto` work;
# the suite runs without it, one worker, about three times slower (tests/conftest.py).
dev = ["pytest>=8", "pytest-xdist>=3",
       "ruff>=0.16",       # `ruff check`, the rules in [tool.ruff] below (CI: .github/workflows/lint.yml)
       "pyrefly==1.3.2",   # the type checker: [tool.pyrefly] below, the gate tests/test_typecheck.py
                           # (CI: .github/workflows/typecheck.yml); pinned, as a new release brings new checks
       "typing_extensions>=4.6",  # what typing_compat.py names for the checker (never imported at runtime)
       "setuptools>=77", "types-setuptools",  # the checker reads build_backend/, which builds on them
       "fonttools>=4.40",  # themes/google/fonts/build_fonts.py cuts the theme's fonts
       "brotli>=1.0",      # tests/test_fontfiles.py writes and reads a .woff2
       # The offline suite runs without the client library (tests/test_gapi.py proves it in a
       # subprocess where the import fails); the live suites - markers slides, sync, docs - do not.
       "google-api-python-client>=2.0", "google-auth-oauthlib>=1.2"]

[project.urls]
Homepage = "https://github.com/borithefirst/beamer2slides"
Repository = "https://github.com/borithefirst/beamer2slides"

[project.scripts]
beamer2slides = "beamer2slides.__main__:main"
beamer2slides-mcp = "beamer2slides.agent.mcp:main"

[build-system]
# setuptools, behind a type check: build_backend/beamer2slides_build.py fails any build pyrefly
# does not pass (docs/typing.md). The checker reads the imported packages' types from this
# environment, so they are here, pinned, for the same answer everywhere (numpy 2.5 has no 3.10 wheel).
requires = ["setuptools==84.0.0", "types-setuptools==84.0.0.20260812", "pyrefly==1.3.2", "typing_extensions==4.16.0",
            "numpy==2.5.3; python_version >= '3.11'", "numpy==2.2.6; python_version < '3.11'",
            "pillow==12.3.0", "pypdfium2==5.13.0", "python-pptx==1.0.2", "fonttools==4.65.0",
            "google-api-python-client==2.200.0", "google-auth-oauthlib==1.4.1"]
build-backend = "beamer2slides_build"
backend-path = ["build_backend"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beamer2slides = ["calibration/*.json",   # the measured font substitutes emit needs
                 "playground/static/*",  # the playground's page (docs/playground.md)
                 "agent/*.md",           # the guide that travels with the agent tools
                 "tex/*.sty",            # b2snotes.sty, `notes-package` (docs/speaker-notes.md)
                 "devtools/showcase/template.html", "devtools/showcase/decks.json"]  # the public gallery

[tool.ruff]
target-version = "py310"   # the oldest Python the package runs on: ruff flags newer syntax
src = ["src", "tests", "tools"]
extend-exclude = ["examples", "themes", "calibration"]

[tool.ruff.lint]
# Names that are unused or undefined (pyflakes), syntax errors, and bugbear's likely bugs (an
# exception re-raised without its cause, a loop variable shadowing its iterable, a mutable default).
# Not style: the code's own idiom stands. Off: B905 (zip without strict=; most zips pair lists built
# to the same length), B007 (an unused loop variable is a name, not a bug), and B023 (a closure over
# a loop variable: all 32 sites were read on 2026-09-27 and every one is called within its
# iteration - key= functions, predicates handed to any()/sorted(), Eraser.remove_chars).
select = ["F", "E9", "B"]
ignore = ["B905", "B007", "B023"]

[tool.pyrefly]
# Types, for the bug class of 688ebf4: deck.json elements are plain dicts, and marked.py produced
# ones emit could not take (a shape kind with no Slides preset, no `flip`, an outline as a bare
# colour, a table without its layout). A TypedDict says what an element holds; the checker finds
# who breaks it. pyrefly over pyright (2026-09-29): the same TypedDict findings, as much noise
# (1,586 errors against 1,482 over the package, the same families), 0.8 s against 24 s, one binary
# (no node), and a baseline file that survives line moves.
#
# The gate is tests/test_typecheck.py (GATED there; CI: .github/workflows/typecheck.yml), one run
# over the whole package read module by module, not an include list here: pyrefly infers an
# unannotated function's return type only inside the files it checks, so a module's answer depends
# on which others are checked with it. Locally: `python -m pytest
# tests/test_typecheck.py`, which names the interpreter; a bare `pyrefly check` lists every error in
# the package and reads site-packages from the `python` on PATH (the activated venv, or else none).
project-includes = ["src/beamer2slides", "build_backend"]
search-path = ["src"]       # this tree's own package, never the editable install's (a worktree checks itself)
preset = "strict"
python-version = "3.10"     # the oldest Python the package runs on: 3.11 names (typing.Self, datetime.UTC) are errors
python-platform = "linux"   # what CI checks, so Windows gets the same answers (sys.platform branches)
use-ignore-files = false    # git ignores .claude/worktrees/, and pyrefly then skipped a worktree's own files
baseline = "typecheck/baseline.json"
enabled-ignores = []        # no suppression comment is honoured: `# type: ignore` is an error left standing

[tool.beamer2slides.typecheck]
# tests/ is checked too, against typecheck/tests_baseline.json (build_backend's "tests" target, gated
# by tests/test_typecheck.py; CI installs these beside the build's pins). The tests read pytest's
# types, so its version is pinned here, as the build pins what the package imports.
tests-requires = ["pytest==9.1.1"]

[tool.pyrefly.errors]
# Reading a key a TypedDict does not promise (`el["flip"]` where flip is optional): the 688ebf4
# KeyError. Off in pyrefly's default and strict presets, on in pyright's.
not-required-key-access = "error"
# strict's warnings are errors here: a warning nobody must act on is one nobody reads
unnecessary-type-conversion = "error"
redundant-condition = "error"
untyped-import = "error"

[tool.pytest.ini_options]
markers = ["slides: converts decks on real Google Slides and measures the thumbnails (opt-in: python -m pytest -m slides)",
           "sync: sync and pull scenarios with simulated deck edits on real Google Slides (opt-in: python -m pytest -m sync)",
           "inverse: pull's compile loop on source pairs, synthetic deck edits, and the agent benchmark's latex tier (opt-in: python -m pytest -m inverse)",
           "docs: the Google Docs loop on a real document (opt-in: python -m pytest -m docs)",
           "needs_decks(*paths): reads files under tests/decks (built PDFs, build scripts); skipped when one is missing (tests/conftest.py)",
           "xdist_group: which -n worker a test goes to (pytest-xdist's own; declared so the suite is quiet without it)"]
addopts = "-m \"not slides and not sync and not inverse and not docs\""
