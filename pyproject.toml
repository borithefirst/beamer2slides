[project]
name = "beamer2slides"
version = "0.0.1"
description = "Convert beamer PDFs into editable Google Slides decks"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "pypdfium2>=5.0",
    "numpy>=2.0",
    "pillow>=10.1",
    "python-pptx>=1.0",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["slides: converts decks on real Google Slides and measures the thumbnails (opt-in: python -m pytest -m slides)",
           "sync: sync and pull scenarios with simulated deck edits on real Google Slides (opt-in: python -m pytest -m sync)"]
addopts = "-m \"not slides and not sync\""
