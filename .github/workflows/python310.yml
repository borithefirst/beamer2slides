# The offline suite on Python 3.10, the oldest the package declares: Google's monorepo builds some
# targets with it, and 0.8.3 died there on a 3.11 regex (tests/test_python310.py). No TeX here, so
# the tests that read built decks skip (conftest's needs_decks); what runs is the library's Python.
# Unpinned: .github/constraints.txt pins versions (numpy 2.5) that no longer install on 3.10.
name: python310

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "pyproject.toml", ".github/workflows/python310.yml"]

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]"
      - name: Offline suite
        run: python -m pytest -q -n auto --dist loadgroup -rfE
