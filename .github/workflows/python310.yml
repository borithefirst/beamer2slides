# The offline suite on Python 3.10, the oldest the package declares: Google's monorepo builds some
# targets with it, and 0.8.3 died there on a 3.11 regex (tests/test_python310.py). No TeX here, so
# the tests that read built decks skip (conftest's needs_decks); what runs is the library's Python.
# Unpinned: .github/constraints.txt pins versions (numpy 2.5) that no longer install on 3.10.
name: python310

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "pyproject.toml", ".github/workflows/python310.yml"]

jobs:
  suite:
    runs-on: ubuntu-latest
    env:
      # the faces PDFium compiles in (as in pure-pdf.yml): without them the pure reader's
      # substituted fonts fall back and its text comes out as U+FFFD
      B2S_FOXIT_FONTS: ${{ github.workspace }}/.foxit-faces
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.foxit-faces
          key: foxit-${{ runner.os }}-${{ hashFiles('src/beamer2slides/pdf/pure/foxit.py') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install -e ".[dev]"
          python -m beamer2slides.pdf.pure.foxit
      - name: Offline suite
        shell: bash
        run: |
          status=0   # (bash -e: a failing pytest would end the script before its summary)
          python -m pytest -q -n auto --dist loadgroup -rfE --tb=line > /tmp/pytest.txt 2>&1 || status=$?
          cat /tmp/pytest.txt
          # the summary and each failure where anyone can read them (a job's log needs sign-in)
          echo "::notice title=python 3.10::$(tail -n 1 /tmp/pytest.txt)"
          { grep -E '^(FAILED|ERROR)' /tmp/pytest.txt || true; } | cut -c1-300 | while read -r line; do echo "::error title=failed::$line"; done
          { grep -E '^E  |Error:' /tmp/pytest.txt || true; } | sort | uniq -c | sort -rn | head -n 20 | cut -c1-300 | while read -r line; do echo "::warning title=error lines::$line"; done
          exit $status
