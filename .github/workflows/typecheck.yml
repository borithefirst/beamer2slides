# The type check (docs/typing.md). Every build of the package already runs it - the editable
# install below is refused if pyrefly finds an error outside typecheck/baseline.json - and this
# workflow adds what a build cannot say: the baseline holds nothing already fixed and never grows
# (tests/test_typecheck.py), the probes still see their bug classes, and the pattern ledger
# (typecheck/rules.json: default arguments, defaulted dataclass fields, Any) only goes down
# (tests/test_typing_rules.py).
#
# On 3.12 with exactly the versions the build pins ([build-system] requires), which is the
# environment the baseline was made in: the checker reads those packages' types, and another numpy
# words its errors differently. B2S_TYPECHECK_REQUIRED turns the test's skips (no pyrefly, other
# versions, no pyproject.toml) into failures, so the gate cannot pass by not running. 3.10 is built
# (and so checked, against numpy 2.2) by python310.yml.
#
# Locally, in the dev venv: python -m pytest -q -p no:cacheprovider tests/test_typecheck.py tests/test_typing_rules.py
name: typecheck

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  pyrefly:
    runs-on: ubuntu-latest
    env:
      B2S_TYPECHECK_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The build's pinned versions, then the package (whose build type-checks it)
        run: |
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml', 'rb'))['build-system']['requires']))" > /tmp/pins.txt
          python -m pip install -r /tmp/pins.txt
          python -m pip install -c /tmp/pins.txt -e ".[dev]"
      - run: python -m pytest -q -p no:cacheprovider -rs tests/test_typecheck.py tests/test_typing_rules.py
